
{
    "openapi": "3.0.2",
    "info": {
        "title": "Laravel",
        "version": "1.0.0"
    },
    "servers": [
        {
            "url": "http:\/\/localhost"
        }
    ],
    "paths": {
        "\/api\/custom\/users": {
            "get": {
                "tags": [
                    "Users"
                ],
                "summary": "ユーザーデータの一覧を取得",
                "responses": {
                    "200": {
                        "description": "成功時のレスポンス",
                        "content": {
                            "application\/json": {
                                "schema": {
                                    "$ref": "#\/components\/schemas\/Users"
                                }
                            }
                        }
                    }
                }
            },
            "post": {
                "tags": [
                    "Users"
                ],
                "summary": "新しいユーザーデータを作成",
                "parameters": [
                    {
                        "name": "Accept",
                        "in": "header",
                        "description": "レスポンスのフォーマットを指定します。通常は \"application\/json\" を使用します。",
                        "required": true,
                        "schema": {
                            "default": "application\/json",
                            "type": "string"
                        }
                    }
                ],
                "requestBody": {
                    "description": "ユーザー作成のためのリクエストボディ",
                    "content": {
                        "application\/json": {
                            "schema": {
                                "$ref": "#\/components\/schemas\/StoreUser"
                            }
                        }
                    },
                    "required": true
                },
                "responses": {
                    "200": {
                        "description": "成功時のレスポンス",
                        "content": {
                            "application\/json": {
                                "schema": {
                                    "$ref": "#\/components\/schemas\/User"
                                }
                            }
                        }
                    },
                    "422": {
                        "description": "バリデーションエラー",
                        "content": {
                            "application\/json": {
                                "schema": {
                                    "$ref": "#\/components\/schemas\/ValidationError"
                                }
                            }
                        }
                    }
                }
            }
        },
        "\/api\/custom\/users\/{user}": {
            "get": {
                "tags": [
                    "Users"
                ],
                "summary": "ユーザーデータの詳細を取得",
                "parameters": [
                    {
                        "name": "user",
                        "in": "path",
                        "required": true,
                        "schema": {
                            "type": "string"
                        }
                    }
                ],
                "responses": {
                    "200": {
                        "description": "成功時のレスポンス",
                        "content": {
                            "application\/json": {
                                "schema": {
                                    "$ref": "#\/components\/schemas\/User"
                                }
                            }
                        }
                    },
                    "404": {
                        "description": "リソースが見つかりません"
                    }
                }
            }
        }
    },
    "components": {
        "schemas": {
            "ValidationError": {
                "type": "object",
                "properties": {
                    "message": {
                        "description": "エラーメッセージ",
                        "type": "string",
                        "example": "The given data was invalid."
                    },
                    "errors": {
                        "description": "フィールドごとのエラー一覧（各プロパティは文字列配列）",
                        "type": "object",
                        "additionalProperties": {
                            "type": "array",
                            "items": {
                                "type": "string"
                            }
                        }
                    }
                }
            },
            "StoreUser": {
                "type": "object",
                "required": [
                    "name",
                    "email",
                    "password"
                ],
                "properties": {
                    "name": {
                        "description": "ユーザーのフルネーム",
                        "format": "string",
                        "type": "string",
                        "example": "山田 太郎"
                    },
                    "email": {
                        "description": "有効なメールアドレス",
                        "format": "string",
                        "type": "string",
                        "example": "taro.yamada@example.com"
                    },
                    "password": {
                        "description": "パスワード（8文字以上）",
                        "format": "password",
                        "type": "string",
                        "example": "password123"
                    }
                }
            },
            "Users": {
                "type": "object",
                "properties": {
                    "data": {
                        "type": "array",
                        "items": {
                            "$ref": "#\/components\/schemas\/User"
                        }
                    },
                    "links": {
                        "type": "object",
                        "properties": {
                            "first": {
                                "type": "string",
                                "nullable": true
                            },
                            "last": {
                                "type": "string",
                                "nullable": true
                            },
                            "prev": {
                                "type": "string",
                                "nullable": true
                            },
                            "next": {
                                "type": "string",
                                "nullable": true
                            }
                        }
                    },
                    "meta": {
                        "type": "object",
                        "properties": {
                            "current_page": {
                                "type": "integer"
                            },
                            "from": {
                                "type": "integer",
                                "nullable": true
                            },
                            "last_page": {
                                "type": "integer"
                            },
                            "path": {
                                "type": "string"
                            },
                            "per_page": {
                                "type": "integer"
                            },
                            "to": {
                                "type": "integer",
                                "nullable": true
                            },
                            "total": {
                                "type": "integer"
                            }
                        }
                    }
                }
            },
            "InternalServerError": {
                "type": "object",
                "properties": {
                    "message": {
                        "description": "汎用エラーメッセージ",
                        "type": "string",
                        "example": "Internal Server Error"
                    },
                    "errorId": {
                        "description": "ログ照会用のエラー識別子（サポート用）",
                        "type": "string",
                        "example": "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    }
                }
            },
            "User": {
                "type": "object",
                "properties": {
                    "id": {
                        "description": "ユーザーID",
                        "type": "integer",
                        "example": 1
                    },
                    "name": {
                        "description": "ユーザー名",
                        "type": "string",
                        "example": "John Doe"
                    },
                    "email": {
                        "description": "メールアドレス",
                        "type": "string",
                        "example": "john.doe@example.com"
                    },
                    "created_at": {
                        "description": "作成日時",
                        "format": "date-time",
                        "type": "string",
                        "example": "2024-01-01T12:00:00Z"
                    },
                    "updated_at": {
                        "description": "更新日時",
                        "format": "date-time",
                        "type": "string",
                        "example": "2024-01-01T13:00:00Z"
                    }
                }
            }
        }
    }
}
